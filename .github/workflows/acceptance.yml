name: Truthful release acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: '3.12.11'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.8'
          python-version: '3.12.11'
          enable-cache: false
      - name: Check lock freshness and install without rewriting it
        run: |
          uv lock --check
          uv sync --frozen
          uv --version
          uv run --frozen python --version
      - name: Collect every test and run full suite including wheel references
        env:
          RESEARCH_OS_E2E_OUTPUT: ${{ runner.temp }}/acceptance/references
        run: uv run --frozen python tests/e2e/run_suite.py --output "$RUNNER_TEMP/acceptance/tests"
      - name: Strict independent release gates (currently expected red, not waived)
        if: always()
        run: uv run --frozen python tests/e2e/check_release.py --output "$RUNNER_TEMP/acceptance/gates"
      - name: Preserve counts, reports, actual PDFs and frozen Publications
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: truthful-release-acceptance
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: error
          retention-days: 14
